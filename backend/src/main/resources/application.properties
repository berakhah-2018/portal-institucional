spring.application.name=portal-institucional
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.frontend-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=always
app.auth.role-mappings=${APP_AUTH_ROLE_MAPPINGS:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
